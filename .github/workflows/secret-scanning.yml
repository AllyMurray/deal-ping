name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Verify detection rules
        run: bun run secrets:test
      - name: Scan source files
        run: bun run secrets:scan
      - name: Scan new commits
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/scan-secrets.ts commits
